[project]
name = "terratwin-backend"
version = "0.1.0"
description = "TerraTwin application foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.7", "uvicorn==0.54.0", "pydantic==2.14.3",
  "pydantic-settings==2.16.3", "sqlalchemy[asyncio]==2.0.57",
  "asyncpg==0.32.0", "psycopg[binary]==3.3.9", "alembic==1.20.1",
  "structlog==26.1.0",
  "numpy==2.5.4",
  "rasterio==1.5.2",
  "pyproj==3.7.2",
]
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1",
       "ruff==0.17.5", "mypy==1.20.2"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL/PostGIS database"]

