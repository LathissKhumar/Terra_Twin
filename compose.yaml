services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: terratwin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-terratwin}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - terratwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    environment: &backend_environment
      ENVIRONMENT: development
      DEBUG: "false"
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-terratwin}
      DATA_DIR: /app/data
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    container_name: terratwin-backend
    restart: unless-stopped
    user: "${TERRATWIN_UID:-1000}:${TERRATWIN_GID:-1000}"
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: terratwin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  terratwin_pgdata:

