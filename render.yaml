services:
  - type: web
    name: terratwin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: TerraTwin
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "https://frontend-alpha-azure-30.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: terratwin-db
          property: connectionString

databases:
  - name: terratwin-db
    databaseName: terratwin
    user: terratwin
    plan: free
    region: oregon

